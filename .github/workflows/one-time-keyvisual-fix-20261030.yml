name: One-time Key Visual two-point correction - TEST only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-keyvisual-fix-20261030.yml'
permissions:
  contents: write
jobs:
  fix-test-only:
    if: github.event.head_commit.message == 'Apply two targeted Key Visual fixes on test site only'
    runs-on: ubuntu-latest
    steps:
      - name: Check out test repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: true
      - name: Install image editing library
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Correct only two faces and reduce side preview width 50 percent
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter, ImageDraw
          import hashlib, subprocess, io

          imgfile=Path('assets/hero-05.jpg')
          original=imgfile.read_bytes()
          assert hashlib.sha256(original).hexdigest()=='3924b0bf3cdbcb898bf509ab1bcd57ebf0a2a4436fc62714753d299a18e0ec58'
          assert subprocess.check_output(['git','hash-object',str(imgfile)]).decode().strip()=='9ca015acd0ecfebab94f04a2588ad6a94900b443'
          image=Image.open(io.BytesIO(original)).convert('RGB')
          assert image.size==(1536,864)
          # Two women in black and pink only. Original photograph content is not regenerated.
          # Mask is in the real image's pixel coordinates, not viewport/screenshot coordinates.
          mask=Image.new('L',image.size,0)
          draw=ImageDraw.Draw(mask)
          for bounds in ((689,476,768,568),(864,466,955,566)):
              draw.ellipse(bounds,fill=165)
          mask=mask.filter(ImageFilter.GaussianBlur(9))
          softened=Image.composite(image.filter(ImageFilter.GaussianBlur(5)),image,mask)
          softened.save(imgfile,'JPEG',quality=85,optimize=True,progressive=True,subsampling=0)
          assert imgfile.stat().st_size>100000

          page=Path('index.html')
          html=page.read_text(encoding='utf-8')
          replacements=[
            ('transform:translate3d(calc(-70vw - 22px),0,0);','transform:translate3d(calc(-85vw + 11px),0,0);'),
            ('flex:0 0 80vw;width:80vw;height:100%;overflow:hidden;', 'flex:0 0 calc(90vw - 22px);width:calc(90vw - 22px);height:100%;overflow:hidden;'),
            ('position:absolute;left:10vw;top:9svh;width:80vw;height:80svh;z-index:2;', 'position:absolute;left:calc(5vw + 11px);top:9svh;width:calc(90vw - 22px);height:80svh;z-index:2;'),
            ('#kv-hero .kv-carousel-track{gap:12px;transform:translate3d(calc(-88vw - 12px),0,0)}', '#kv-hero .kv-carousel-track{gap:12px;transform:translate3d(calc(-94vw + 6px),0,0)}'),
            ('#kv-hero .kv-slide{width:92vw;flex-basis:92vw;border-radius:6px}', '#kv-hero .kv-slide{width:calc(96vw - 12px);flex-basis:calc(96vw - 12px);border-radius:6px}'),
            ('top:12svh;left:4vw;width:92vw;height:74svh;border-radius:6px;', 'top:12svh;left:calc(2vw + 6px);width:calc(96vw - 12px);height:74svh;border-radius:6px;'),
          ]
          for before,after in replacements:
              assert html.count(before)==1,('Unexpected markup; abort:',before)
              html=html.replace(before,after)
          page.write_text(html,encoding='utf-8')
          assert html.count('hero-05.jpg')==1
          assert html.count('hero-01.jpg')==2
          assert html.count('hero-06.jpg')==2
          # At any viewport width, visible side fragments are exactly half their previous width.
          for viewport,gap,oldFraction in ((1440,22,.8),(1920,22,.8),(390,12,.92),(600,12,.92)):
              oldPeek=(viewport-(viewport*oldFraction))/2-gap
              newWidth=(.9*viewport-22) if gap==22 else (.96*viewport-12)
              newPeek=(viewport-newWidth)/2-gap
              assert abs(newPeek-oldPeek/2)<1e-7,(viewport,oldPeek,newPeek)
          print('VALIDATED: only designated two faces; six exact carousel CSS sizing strings')
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 2
          git diff --name-only | sort | grep -Fx 'assets/hero-05.jpg'
          git diff --name-only | sort | grep -Fx 'index.html'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/hero-05.jpg
          git commit -m "Fix two face blur positions and halve carousel side previews (test only)"
          git push origin HEAD:main
