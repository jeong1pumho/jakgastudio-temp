name: Install nineteen approved SPACE images - TEST only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-space-gallery-19-20261030.yml'
permissions:
  contents: write
jobs:
  apply-photos:
    if: github.event.head_commit.message == 'Stage 19 supplied SPACE photos in TEMP only'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the test branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          ref: main
      - name: Verify upload, install 19 original photos, and update only SPACE gallery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, html, io, json, re, zipfile
          from pathlib import Path
          target=Path('assets')
          parts=sorted(target.glob('.space-transfer-part-*.txt'))
          expected=[target/f'.space-transfer-part-{i:02}.txt' for i in range(1,19)]
          assert parts==expected, f'Incomplete upload parts: {len(parts)}'
          encoded=''.join(''.join(p.read_text(encoding='ascii').split()) for p in parts)
          payload=base64.b64decode(encoded,validate=True)
          sha=hashlib.sha256(payload).hexdigest()
          assert sha=='6b4e42d5e9fe758c6a6aad84140500f4ee58178f32a1db27a8adb83980c7df3b',('Archive checksum mismatch',sha)
          with zipfile.ZipFile(io.BytesIO(payload)) as z:
              assert z.testzip() is None, 'Archive corruption'
              names=z.namelist()
              files=[f'assets/space-{i:02}.webp' for i in range(1,20)]
              assert set(names)==set(files+['space_photo_manifest.json']), 'Extra/missing photos'
              manifest=json.loads(z.read('space_photo_manifest.json'))
              assert len(manifest)==19
              for i,(m,name) in enumerate(zip(manifest,files),1):
                  assert m['index']==i and name.endswith(f'space-{i:02}.webp')
                  raw=z.read(name)
                  assert hashlib.sha256(raw).hexdigest()==m['sha256'],('Image checksum mismatch',i)
                  assert raw[:4]==b'RIFF' and raw[8:12]==b'WEBP',('Invalid WEBP image',i)
                  Path(name).write_bytes(raw)
          alts=[
            '따뜻한 종이등과 모임 테이블이 있는 공간',
            '작가작업실 JEJU 건물 정면',
            '창밖 정원과 테이블 위에 진열된 책',
            '추천 도서와 작은 꽃이 놓인 책장',
            '햇살 아래 창가 책장을 살펴보는 방문객',
            '책 빌런도감과 독자에게 전하는 글',
            '창가 옆 책이 가득한 긴 서가',
            '창가에 진열된 책과 파란색 표지',
            '책장 앞에서 책을 고르는 방문객',
            '꽃과 푸른 하늘이 있는 건물 외관',
            '다양한 표지가 보이는 추천도서 책장',
            '책 빌런도감과 손글씨 추천 메시지',
            '컵과 노란 전화기가 놓인 테이블',
            '작가작업실의 실제 독서모임 모습',
            '보라색 꽃이 놓인 흰 책상과 서가',
            '햇살을 받으며 전시된 창가의 책들',
            '따뜻하게 빛나는 유리 전구 세 개',
            '작은 종이등과 꽃병이 놓인 창가',
            '커다란 종이등과 책장 및 모임 테이블'
          ]
          assert len(alts)==19
          page=Path('index.html')
          source=page.read_text(encoding='utf-8')
          signature='<div class="space-grid approved-grid space-gallery-20261029">'
          assert source.count(signature)==1,'SPACE grid changed unexpectedly'
          start=source.index(signature)
          end=source.index('</div>',start)+6
          previous=source[start:end]
          assert previous.count('<button')==13,('Unexpected old photo count',previous.count('<button'))
          buttons=[]
          for i,alt in enumerate(alts,1):
              uri=f'/assets/space-{i:02}.webp'
              klass='gallery-photo space-gallery-item'+(' space-photo-primary' if i==1 else '')
              safe=html.escape(alt,quote=True)
              buttons.append(f'<button type="button" class="{klass}" aria-label="{safe} 사진 확대" data-alt="{safe}" data-full="{uri}"><img src="{uri}" alt="{safe}" loading="lazy" decoding="async"/></button>')
          newgrid=signature+'\n'+'\n'.join(buttons)+'</div>'
          updated=source[:start]+newgrid+source[end:]
          assert len(re.findall(r'class="gallery-photo space-gallery-item',updated[start:start+len(newgrid)]))==19
          assert updated[:start]==source[:start] and updated[start+len(newgrid):]==source[end:],'Changes outside SPACE'
          assert all(updated.count(f'/assets/space-{i:02}.webp')==2 for i in range(1,20))
          page.write_text(updated,encoding='utf-8')
          print('Verified and installed 19 exact photos; only SPACE gallery markup changed')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/space-*.webp
          git rm -f assets/.space-transfer-part-*.txt .github/workflows/install-space-gallery-19-20261030.yml
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines())
          wanted={'index.html','.github/workflows/install-space-gallery-19-20261030.yml'}
          wanted|={f'assets/space-{i:02}.webp' for i in range(1,20)}
          wanted|={f'assets/.space-transfer-part-{i:02}.txt' for i in range(1,19)}
          assert changed==wanted,('Unexpected files touched',sorted(changed^wanted))
          PY
          git commit -m 'Replace SPACE collage photos with 19 supplied images in order (temp only)'
          git push origin HEAD:main
