name: SEO sitemap and release checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify SEO release invariants
        run: node seo-check.cjs
