name: Final mobile Key Visual optimization - TEST ONLY
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-mobile-image-audit-20261030.yml'
permissions:
  contents: write
jobs:
  mobile-images:
    if: github.event.head_commit.message == 'Stage TEST-only final mobile image optimization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          ref: main
      - name: Create mobile WebP versions of five authentic photos
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow==11.3.0
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageStat,ImageChops
          import re
          photos=['01','02','03','04','06']
          for n in photos:
              source=Path(f'assets/hero-{n}.jpg')
              assert source.is_file(),str(source)
              original=Image.open(source).convert('RGB')
              assert original.size==(1536,864),f'Unexpected original dimensions: {n}'
              photo=original.copy()
              photo.thumbnail((1050,1000),Image.Resampling.LANCZOS)
              output=Path(f'assets/hero-{n}-mobile.webp')
              photo.save(output,'WEBP',quality=86,method=6)
              assert output.stat().st_size<source.stat().st_size
              reconstruction=Image.open(output).convert('RGB')
              difference=sum(ImageStat.Stat(ImageChops.difference(photo,reconstruction)).mean)/3
              assert difference<5.0,f'Unexpected visual changes: {n}'
              print(n,original.size,'to',reconstruction.size,source.stat().st_size,'to',output.stat().st_size,'mean RGB diff',round(difference,2))
          index=Path('index.html')
          html=index.read_text(encoding='utf-8')
          pattern=r'<img src="/assets/(hero-(?:01|02|03|04|06))\.jpg" ([^>]*)/>'
          def convert(m):
              key=m.group(1)
              attrs=m.group(2)
              return (f'<picture class="kv-mobile-picture"><source media="(max-width:700px)" type="image/webp" '
                      f'srcset="/assets/{key}-mobile.webp"/><img src="/assets/{key}.jpg" {attrs}/></picture>')
          html,n=re.subn(pattern,convert,html)
          assert n==7,('Unexpected hero photo count',n)
          assert html.count('class="kv-mobile-picture"')==7
          assert html.count('class="gallery-photo space-gallery-item')==19
          assert html.count('class="program-row"')==5
          assert '<meta content="noindex, nofollow" name="robots"/>' in html
          assert '<style id="kv-mobile-picture-performance-20261030">' not in html
          before='</head>'
          addition='''<link rel="preload" href="/assets/hero-01-mobile.webp" as="image" type="image/webp" media="(max-width:700px)" fetchpriority="high"/>
          <style id="kv-mobile-picture-performance-20261030">#kv-hero .kv-mobile-picture{display:block;width:100%;height:100%}</style>
          '''
          assert html.count(before)==1
          html=html.replace(before,addition+before)
          # Footer social labels: the accessible name should begin with its visible text.
          for former in [
              ' aria-label="작가작업실 JEJU 공식 인스타그램 (새 창)"',
              ' aria-label="유미경 작가 인스타그램 (새 창)"',
              ' aria-label="작가매니저 스레드 (새 창)"'
          ]:
              assert html.count(former)==1,('Social accessibility anchor changed',former)
              html=html.replace(former,'')
          index.write_text(html,encoding='utf-8')
          print('Verified seven mobile source elements; all others remain unchanged')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/hero-*-mobile.webp
          git commit -m 'Optimize mobile-only photo transfer and social link labels on test site'
          git push origin HEAD:main
