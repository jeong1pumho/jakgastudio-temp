<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>작가 추천 도서 관리 | 작가작업실 JEJU</title><link rel="stylesheet" href="/assets/home-approved.css"><style>
body{padding:0;color:#26382c}main{max-width:1050px;margin:auto;padding:28px 22px 70px}nav{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:30px}h1{font-weight:400}label{display:block;margin:18px 0 6px}input:not([type=checkbox]),textarea{width:100%;padding:12px;border:1px solid #ccd2c7;background:white;font-size:16px}textarea{min-height:160px}button,.button{padding:11px 16px;border:1px solid #26382c;background:#faf8f3;color:#26382c;cursor:pointer;font:inherit}button:disabled{opacity:.5;cursor:wait}.primary{background:#26382c;color:white}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.panel{padding:25px;background:white;border:1px solid #d9ddd2;margin:24px 0}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.photos img{width:100%;aspect-ratio:1;object-fit:cover}.photos button{padding:7px 10px}.photos .actions{gap:5px;margin-top:5px}.list-row{display:flex;gap:20px;align-items:center;padding:18px 0;border-bottom:1px solid #d9ddd2}.list-row img{width:80px;height:80px;object-fit:cover}.list-row .info{flex:1}.list-row p{margin:7px 0;font-size:13px}dialog{width:min(520px,95vw);border:1px solid #d9ddd2;padding:22px;background:#faf8f3;color:#26382c}dialog::backdrop{background:#0008}canvas{display:block;width:100%;aspect-ratio:1;background:#ddd}input[type=range]{padding:0}#message{white-space:pre-wrap;line-height:1.6}small{color:#70766d}[hidden]{display:none!important}@media(max-width:600px){.photos{grid-template-columns:1fr 1fr}.panel{padding:17px}.list-row{flex-wrap:wrap}}
</style></head><body><main><nav><a href="/admin/">모임·행사 관리</a><a href="/admin/books.html" aria-current="page">작가 추천 도서 관리</a><a href="/admin/schedule.html">스케줄 관리</a><a href="/" target="_blank" rel="noopener">Home 보기 ↗</a></nav><h1>작가 추천 도서 관리</h1><p>정사각형 사진과 작가의 추천 메시지를 등록합니다.</p><p id="message" role="status" aria-live="polite"></p>
<form id="login" class="panel"><h2>관리자 로그인</h2><label for="email">이메일</label><input id="email" type="email" autocomplete="username" required><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required><div class="actions"><button class="primary">로그인</button></div></form>
<section id="workspace" hidden><div class="actions"><button id="new" class="primary">추천 도서 등록</button><button id="logout">로그아웃</button></div><div id="list"></div>
<form id="editor" class="panel" hidden><h2 id="editor-heading">추천 도서 등록</h2><label for="title">책 제목</label><input id="title" maxlength="150" required><label for="recommendation">작가 추천내용</label><textarea id="recommendation" maxlength="5000" required></textarea><small>Home에서는 2줄까지 표시되고, 도서 상세에서는 전체 내용을 볼 수 있습니다.</small><label for="photos-input">사진 추가 · 최대 20장</label><input id="photos-input" type="file" accept="image/jpeg,image/png,image/webp"><p><small>사진을 선택하면 정사각형으로 자를 수 있습니다. 첫 번째 사진이 대표 이미지입니다.</small></p><div id="photos" class="photos"></div><label for="sort-order">노출 순서 · 숫자가 클수록 먼저 표시</label><input id="sort-order" type="number" min="-1000000" max="1000000" step="1" value="0" required><label><input id="published" type="checkbox" checked> 홈페이지에 공개</label><div class="actions"><button id="save" class="primary">저장</button><button id="cancel" type="button">취소</button></div></form></section>
<dialog id="crop"><h2>정사각형으로 자르기</h2><canvas id="crop-canvas" width="600" height="600" aria-label="사진 자르기 미리보기"></canvas><label for="zoom">확대</label><input id="zoom" type="range" min="1" max="3" step="0.01" value="1"><label for="horizontal">좌우 위치</label><input id="horizontal" type="range" min="0" max="100" value="50"><label for="vertical">상하 위치</label><input id="vertical" type="range" min="0" max="100" value="50"><div class="actions"><button id="crop-use" class="primary">자르기 적용</button><button id="crop-cancel">취소</button></div></dialog>
</main><script src="/assets/admin-session.js"></script><script src="/assets/books-admin.js"></script></body></html>
