<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>작가작업실 JEJU 운영 소식 관리자</title>
<style>body{font-family:Arial,sans-serif;margin:0;background:#f7f4ee;color:#342f2b}main{max-width:950px;margin:60px auto;padding:28px;background:#fff}input,select,textarea{box-sizing:border-box;display:block;width:100%;padding:12px;border:1px solid #ccc;border-radius:4px;margin:7px 0 17px}textarea{height:220px}button{padding:11px 19px;background:#40372f;color:white;border:0;cursor:pointer;margin:4px}button.secondary{background:#ddd;color:#333}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.thumb{position:relative}.thumb img{width:100%;height:120px;object-fit:cover}.thumb button{padding:5px}.newsRow{padding:14px 5px;border-bottom:1px solid #ddd}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><main><h1>작가작업실 JEJU <small>운영 소식 관리자</small></h1>
<p id="message"></p><section id="login"><h2>관리자 로그인</h2><input id="email" type="email" placeholder="이메일" autocomplete="username"><input id="password" type="password" placeholder="비밀번호" autocomplete="current-password"><button id="loginBtn">로그인</button></section>
<section id="dash" hidden><button class="secondary" id="logout">로그아웃</button><h2>운영 소식 등록 · 수정</h2><input id="postId" type="hidden"><label>제목<input id="title" maxlength="150"></label><label>주소(영문 소문자 또는 자동)<input id="slug" placeholder="book-night"></label>
<label>사진 업로드(최대 9장)<input type="file" id="files" multiple accept="image/png,image/jpeg,image/webp,image/avif"></label><div class="grid" id="photos"></div><label>본문<textarea id="content" placeholder="소개와 안내 내용을 입력하세요"></textarea></label>
<label>상태<select id="status"><option value="draft">임시저장</option><option value="published">공개</option><option value="archived">게시 중단</option></select></label><label>정렬 순서<input id="sort" type="number" value="0"></label>
<button id="save">저장하기</button><button class="secondary" id="clear">새 글</button><h2>등록된 소식</h2><div id="items"></div></section></main>
<script>
const $=id=>document.getElementById(id);let token='',posts=[],imgs=[],cover=0;const msg=s=>$('message').textContent=s;
async function api(path,opt={}){const h={'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};const r=await fetch(path,{...opt,headers:h});const x=await r.json();if(!r.ok)throw Error(x.error||'요청 실패');return x}
function renderPhotos(){$('photos').innerHTML=imgs.map((x,i)=>'<div class="thumb"><img src="'+x+'"><label><input type="radio" name="cover" '+(i===cover?'checked':'')+' data-cover="'+i+'">대표</label><button data-del="'+i+'">삭제</button><button data-left="'+i+'">←</button><button data-right="'+i+'">→</button></div>').join('');document.querySelectorAll('[data-cover]').forEach(e=>e.onchange=()=>{cover=+e.dataset.cover});document.querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>{imgs.splice(+e.dataset.del,1);cover=0;renderPhotos()});document.querySelectorAll('[data-left]').forEach(e=>e.onclick=()=>{let i=+e.dataset.left;if(i>0){[imgs[i-1],imgs[i]]=[imgs[i],imgs[i-1]];renderPhotos()}});document.querySelectorAll('[data-right]').forEach(e=>e.onclick=()=>{let i=+e.dataset.right;if(i<imgs.length-1){[imgs[i+1],imgs[i]]=[imgs[i],imgs[i+1]];renderPhotos()}})}
async function list(){const d=await api('/api/admin');posts=d.items||[];$('items').innerHTML=posts.map((p,i)=>'<div class="newsRow"><b>'+p.title.replaceAll('<','&lt;')+'</b> ('+p.status+') <button data-edit="'+i+'">수정</button><button data-remove="'+i+'">삭제</button></div>').join('');document.querySelectorAll('[data-edit]').forEach(e=>e.onclick=()=>edit(posts[+e.dataset.edit]));document.querySelectorAll('[data-remove]').forEach(e=>e.onclick=async()=>{const p=posts[+e.dataset.remove];if(!confirm('게시물을 삭제할까요?'))return;try{await api('/api/admin?id='+p.id,{method:'DELETE'});msg('삭제 완료');await list()}catch(err){msg(err.message)}})}
function edit(p){$('postId').value=p.id;$('title').value=p.title;$('slug').value=p.slug;$('content').value=p.content;$('status').value=p.status;$('sort').value=p.sort_order;imgs=[...(p.images||[])];cover=p.cover_index||0;renderPhotos();scrollTo(0,0)}
function reset(){$('postId').value='';$('title').value='';$('slug').value='';$('content').value='';$('status').value='draft';$('sort').value='0';imgs=[];cover=0;renderPhotos()}
$('loginBtn').onclick=async()=>{try{const r=await api('/api/admin',{method:'POST',body:JSON.stringify({action:'login',email:$('email').value,password:$('password').value})});token=r.token;$('login').hidden=true;$('dash').hidden=false;$('password').value='';msg('로그인 성공');await list()}catch(e){msg(e.message)}};
$('logout').onclick=()=>{token='';$('login').hidden=false;$('dash').hidden=true;msg('로그아웃')};$('clear').onclick=reset;
$('files').onchange=async()=>{try{const conf=await api('/api/admin?action=config');const newFiles=[...$('files').files];if(imgs.length+newFiles.length>9)throw Error('사진은 최대 9장입니다');for(const f of newFiles){if(f.size>10*1024*1024)throw Error('파일 크기는 최대 10MB');const name='posts/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+f.name.split('.').pop().toLowerCase();const r=await fetch(conf.url+'/storage/v1/object/news-media/'+name,{method:'POST',headers:{apikey:conf.key,Authorization:'Bearer '+token,'Content-Type':f.type,'x-upsert':'false'},body:f});if(!r.ok)throw Error('사진 업로드 실패');imgs.push(conf.url+'/storage/v1/object/public/news-media/'+name)}renderPhotos();msg('사진 업로드 완료')}catch(e){msg(e.message)}};
$('save').onclick=async()=>{try{const id=$('postId').value;const b={id,title:$('title').value,slug:$('slug').value,content:$('content').value,images:imgs,cover_index:cover,status:$('status').value,sort_order:$('sort').value};await api('/api/admin',{method:id?'PATCH':'POST',body:JSON.stringify(b)});msg('저장 완료');reset();await list()}catch(e){msg(e.message)}};
</script></body></html>
