<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>운영 소식 관리 | 작가작업실 JEJU</title>
<style>
:root{--ink:#35302c;--muted:#817970;--light:#faf8f4;--edge:#e7e1d8;--accent:#9d765e;--button:#3c3530;--bg:#f7f5f1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.container{max-width:1130px;margin:0 auto;padding:32px 22px 80px}
.site-header{display:flex;justify-content:space-between;align-items:center;gap:14px;border-bottom:1px solid var(--edge);padding:6px 0 26px;margin-bottom:32px}
.wordmark{font-size:20px;font-weight:600;letter-spacing:-.04em}.wordmark small{font-size:11px;color:var(--muted);font-weight:400;letter-spacing:0;margin-left:12px}
a{color:inherit}.site-header a{text-decoration:none}
.panel{background:white;border:1px solid var(--edge);border-radius:7px;padding:32px}
.page-heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}
h1{font-size:27px;letter-spacing:-.05em;margin:0;font-weight:600}h2{font-size:20px;margin:0 0 18px}
.subline{color:var(--muted);font-size:13px;margin:5px 0 0}
.btn{background:var(--button);color:#fff;border:1px solid var(--button);border-radius:4px;padding:11px 18px;line-height:1.25;white-space:nowrap}
.btn:hover{filter:brightness(1.13)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.secondary{background:#fff;border-color:#cfc7be;color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:transparent}
.btn.danger{background:#fff;border-color:#ba7b70;color:#9e3a31}
.btn.small{padding:7px 12px;font-size:13px}
.label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}
.field{display:block;width:100%;border:1px solid #cec6bc;border-radius:4px;padding:12px 13px;background:#fff;color:var(--ink);outline-offset:2px}
.field:focus{outline:2px solid #ad8c72;border-color:#ad8c72}
.form-row{margin:0 0 22px}.form-row textarea{min-height:260px;resize:vertical;line-height:1.8}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.toolbar{display:flex;gap:12px;margin:0 0 22px;flex-wrap:wrap}
.toolbar .search{flex:1;min-width:210px}.toolbar .filter{width:175px;max-width:100%}
.list-wrap{overflow-x:auto;border:1px solid var(--edge);border-radius:5px}
table{width:100%;border-collapse:collapse;text-align:left}
thead{background:var(--light)}th{font-size:12px;color:var(--muted);font-weight:600}
td,th{padding:14px 15px;border-bottom:1px solid var(--edge)}
tbody tr:last-child td{border-bottom:0}
.post-info{display:flex;align-items:center;gap:15px;min-width:260px}
.cover{width:72px;height:72px;object-fit:cover;background:#eeeae5;border-radius:3px;flex-shrink:0}
.cover.empty{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.post-title{font-weight:600;overflow-wrap:anywhere}
.post-sub{font-size:12px;color:var(--muted);margin-top:3px}
.badge{display:inline-block;border-radius:3px;padding:3px 8px;background:#f2f0ed;font-size:12px;white-space:nowrap}
.badge.public{background:#ebf4ec;color:#376748}.badge.draft{background:#f6efe2;color:#765e30}
.badge.archived{background:#efeff1;color:#686875}
.actions{display:flex;gap:6px;white-space:nowrap}
.counter{color:var(--muted);font-size:13px;margin-top:16px}
.empty-state{text-align:center;padding:68px 12px;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.photo-card{border:1px solid var(--edge);padding:8px;border-radius:4px}
.photo-card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--light)}
.photo-controls{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:8px}
.photo-controls .btn{font-size:12px;padding:5px 8px}
.photo-controls label{font-size:12px;display:inline-flex;gap:4px;align-items:center;margin-right:auto}
.edit-footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--edge);padding-top:24px;margin-top:30px}
.status{min-height:24px;font-size:13px;margin:-8px 0 20px;white-space:pre-wrap}
.status.error{color:#a13c30}.status.ok{color:#336744}
.login-box{max-width:420px;margin:65px auto 0}.login-box h1{margin-bottom:10px}.login-box button{width:100%;margin-top:6px}
.list-head-actions{display:flex;gap:8px;align-items:center}
@media(max-width:800px){.container{padding:18px 14px 55px}.panel{padding:22px 16px}.wordmark small{display:none}.page-heading{align-items:flex-start;gap:12px}h1{font-size:23px}.form-grid{grid-template-columns:1fr}.photos{grid-template-columns:repeat(2,minmax(0,1fr))}table{min-width:670px}.toolbar .filter{width:100%}}
@media(max-width:470px){.page-heading{flex-direction:column;align-items:stretch}.list-head-actions{justify-content:space-between}.page-heading .btn{align-self:stretch}.photos{grid-template-columns:1fr}.site-header{gap:8px}.wordmark{font-size:18px}}
</style>
</head>
<body>
<div class="container">
<header class="site-header">
  <a class="wordmark" href="/#news">작가작업실 JEJU <small>운영 소식 관리자</small></a>
  <button type="button" class="btn ghost small" id="logout" hidden>로그아웃</button>
</header>
<p id="message" class="status" role="status" aria-live="polite"></p>

<section id="loginView" class="panel login-box">
  <h1>관리자 로그인</h1>
  <p class="subline">운영 소식을 등록하거나 수정할 수 있습니다.</p>
  <form id="loginForm">
    <div class="form-row"><label class="label" for="email">이메일</label><input class="field" id="email" type="email" required autocomplete="username"></div>
    <div class="form-row"><label class="label" for="password">비밀번호</label><input class="field" id="password" type="password" required autocomplete="current-password"></div>
    <button type="submit" class="btn" id="loginBtn">로그인</button>
  </form>
</section>

<section id="listView" hidden>
  <div class="page-heading">
    <div><h1>운영 소식 관리</h1><p class="subline">등록한 게시물을 검색하고 수정·삭제할 수 있습니다.</p></div>
    <div class="list-head-actions"><button type="button" class="btn" id="newBtn">+ 새 소식 등록</button></div>
  </div>
  <div class="panel">
    <div class="toolbar">
      <input class="field search" id="search" type="search" placeholder="소식 제목 검색" aria-label="소식 제목 검색">
      <select class="field filter" id="filter" aria-label="게시 상태 필터">
        <option value="all">전체 상태</option>
        <option value="published">공개</option>
        <option value="draft">임시저장</option>
        <option value="archived">게시중단</option>
      </select>
    </div>
    <div id="listArea" class="list-wrap"></div>
    <div class="counter" id="counter">게시물 조회 중</div>
  </div>
</section>

<section id="editView" hidden>
  <div class="page-heading">
    <div><h1 id="editHeading">새 소식 등록</h1><p class="subline" id="editSubline">제목과 내용을 입력하고 게시 상태를 선택하세요.</p></div>
    <button type="button" class="btn secondary" id="backBtn">← 목록으로</button>
  </div>
  <div class="panel">
    <form id="editForm">
      <input id="postId" type="hidden">
      <div class="form-row"><label class="label" for="title">소식 제목</label><input class="field" id="title" required minlength="2" maxlength="150"></div>
      <div class="form-row"><label class="label" for="slug">상세페이지 주소 (영문, 선택사항)</label><input class="field" id="slug" placeholder="비워 두면 자동 생성" pattern="[a-z0-9]+(-[a-z0-9]+)*"><p class="note">기존 글을 수정할 때는 주소를 변경하지 않는 편이 좋습니다.</p></div>
      <div class="form-row">
        <label class="label" for="files">사진 등록 · 최대 9장</label>
        <input class="field" id="files" type="file" multiple accept="image/jpeg,image/png,image/webp,image/avif">
        <p class="note">대표사진 선택, 순서 변경, 제외가 가능합니다. 한 장당 최대 10MB.</p>
        <div id="photos" class="photos"></div>
      </div>
      <div class="form-row"><label class="label" for="content">상세 내용</label><textarea class="field" id="content" placeholder="운영 소식의 상세 내용을 입력하세요. 줄바꿈은 그대로 표시됩니다."></textarea></div>
      <div class="form-grid">
        <div class="form-row"><label class="label" for="status">게시 상태</label><select class="field" id="status"><option value="draft">임시저장</option><option value="published">공개</option><option value="archived">게시중단</option></select></div>
        <div class="form-row"><label class="label" for="sort">게시 순서</label><input class="field" id="sort" type="number" step="1" value="0"><p class="note">값이 클수록 목록 상단에 표시됩니다.</p></div>
      </div>
      <div class="edit-footer">
        <button type="button" class="btn secondary" id="cancelBtn">취소 · 목록으로</button>
        <button type="submit" class="btn" id="saveBtn">저장하기</button>
      </div>
    </form>
  </div>
</section>
</div>

<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  let token = '';
  let posts = [];
  let imgs = [];
  let cover = 0;
  let saving = false;
  const statusNames = { published:'공개', draft:'임시저장', archived:'게시중단' };

  function message(s, error) {
    $('message').textContent = s || '';
    $('message').className = 'status' + (error ? ' error' : s ? ' ok' : '');
  }
  function show(view) {
    ['loginView','listView','editView'].forEach(id => { $(id).hidden = (id !== view); });
    $('logout').hidden = (view === 'loginView');
    window.scrollTo(0,0);
  }
  async function api(path, opt) {
    const o = opt || {};
    const headers = { 'Content-Type':'application/json' };
    if(token) headers.Authorization = 'Bearer ' + token;
    let r;
    try { r = await fetch(path, { ...o, headers }); }
    catch { throw Error('서버에 연결할 수 없습니다. 인터넷 연결을 확인해 주세요.'); }
    const body = await r.json().catch(() => ({}));
    if(!r.ok) throw Error(body.error || '요청 실패 (HTTP ' + r.status + ')');
    return body;
  }
  const el = (tag, cls, txt) => {
    const x = document.createElement(tag);
    if(cls) x.className = cls;
    if(txt !== undefined) x.textContent = txt;
    return x;
  };
  function dateText(v) {
    if(!v) return '-';
    const d = new Date(v);
    if(!Number.isFinite(d.getTime())) return '-';
    return new Intl.DateTimeFormat('ko-KR', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d);
  }
  function filterList() {
    const term = $('search').value.trim().toLocaleLowerCase('ko');
    const state = $('filter').value;
    const rows = posts.filter(p => (state === 'all' || p.status === state) && String(p.title || '').toLocaleLowerCase('ko').includes(term));
    const area = $('listArea');
    area.replaceChildren();
    if(!rows.length) {
      area.appendChild(el('div','empty-state', posts.length ? '검색 조건에 맞는 소식이 없습니다.' : '아직 등록된 운영 소식이 없습니다. 새 소식을 등록해 보세요.'));
    } else {
      const table = el('table');
      const thead = el('thead');
      const tr = el('tr');
      ['소식','상태','마지막 수정','관리'].forEach(s => tr.appendChild(el('th','',s)));
      thead.appendChild(tr); table.appendChild(thead);
      const tbody = el('tbody');
      rows.forEach(p => {
        const tr = el('tr');
        const td0 = el('td');
        const info = el('div','post-info');
        const img = Array.isArray(p.images) ? p.images[p.cover_index] || p.images[0] : null;
        if(img) {
          const pic = el('img','cover');pic.src = img;pic.alt = '대표 사진';pic.loading = 'lazy';
          info.appendChild(pic);
        } else info.appendChild(el('div','cover empty','사진 없음'));
        const desc = el('div');
        desc.appendChild(el('div','post-title',p.title));
        desc.appendChild(el('div','post-sub','사진 ' + (p.images?.length || 0) + '장'));
        info.appendChild(desc); td0.appendChild(info); tr.appendChild(td0);
        const td1 = el('td');
        td1.appendChild(el('span','badge ' + (p.status === 'published' ? 'public' : p.status === 'draft' ? 'draft' : 'archived'), statusNames[p.status] || p.status));
        tr.appendChild(td1);
        tr.appendChild(el('td','note',dateText(p.updated_at)));
        const td3 = el('td');
        const controls = el('div','actions');
        const editBtn = el('button','btn secondary small','수정');
        editBtn.type = 'button';editBtn.addEventListener('click',() => editPost(p));
        const delBtn = el('button','btn danger small','삭제');
        delBtn.type = 'button';delBtn.addEventListener('click',() => deletePost(p));
        controls.append(editBtn,delBtn);td3.appendChild(controls);tr.appendChild(td3);tbody.appendChild(tr);
      });
      table.appendChild(tbody);area.appendChild(table);
    }
    $('counter').textContent = '전체 ' + posts.length + '개 · 표시 ' + rows.length + '개  |  최근 수정순';
  }
  async function loadPosts() {
    $('counter').textContent = '게시물 조회 중…';
    const r = await api('/api/admin');
    posts = Array.isArray(r.items) ? r.items : [];
    posts.sort((a,b) => new Date(b.updated_at||0) - new Date(a.updated_at||0));
    filterList();
  }
  function addButton(parent, label, handler, disabled) {
    const b = el('button','btn secondary small',label);
    b.type='button';b.disabled=!!disabled;b.addEventListener('click',handler);parent.appendChild(b);
  }
  function movePhoto(i,j) {
    if(j<0 || j>=imgs.length) return;
    const a = imgs[i];imgs[i]=imgs[j];imgs[j]=a;
    if(cover===i) cover=j; else if(cover===j) cover=i;
    renderPhotos();
  }
  function renderPhotos() {
    const root = $('photos');root.replaceChildren();
    imgs.forEach((src,i) => {
      const item = el('div','photo-card');
      const pic = el('img');pic.src=src;pic.alt='등록 사진 '+(i+1);pic.loading='lazy';item.appendChild(pic);
      const tools = el('div','photo-controls');
      const label = el('label');
      const radio = el('input');radio.type='radio';radio.name='cover';radio.checked=(cover===i);
      radio.addEventListener('change',() => {cover=i;renderPhotos();});
      label.append(radio,document.createTextNode('대표사진'));tools.appendChild(label);
      addButton(tools,'←',() => movePhoto(i,i-1),i===0);
      addButton(tools,'→',() => movePhoto(i,i+1),i===imgs.length-1);
      addButton(tools,'제외',() => {imgs.splice(i,1);cover = Math.min(cover>=i&&cover>0?cover-1:cover,Math.max(0,imgs.length-1));renderPhotos();});
      item.appendChild(tools);root.appendChild(item);
    });
  }
  function resetForm() {
    $('editForm').reset();
    $('postId').value = '';
    $('sort').value = 0;
    $('status').value='draft';
    imgs=[];cover=0;renderPhotos();
  }
  function newPost() {
    message('');resetForm();
    $('editHeading').textContent='새 소식 등록';
    $('editSubline').textContent='내용을 입력하고 임시저장 또는 공개로 등록하세요.';
    $('saveBtn').textContent='등록하기';
    show('editView');
  }
  function editPost(p) {
    message('');resetForm();
    $('postId').value=p.id;
    $('title').value=p.title||'';
    $('slug').value=p.slug||'';
    $('content').value=p.content||'';
    $('status').value=p.status||'draft';
    $('sort').value=p.sort_order||0;
    imgs=Array.isArray(p.images)?p.images.slice(0,9):[];
    cover=Math.max(0,Math.min(Number(p.cover_index)||0,imgs.length-1));
    renderPhotos();
    $('editHeading').textContent='운영 소식 수정';
    $('editSubline').textContent='기존 내용을 불러왔습니다. 변경 후 저장하기를 선택하세요.';
    $('saveBtn').textContent='수정 내용 저장';
    show('editView');
  }
  async function deletePost(p) {
    const ok = window.confirm('"' + p.title + '" 게시물을 삭제하시겠습니까?\n\n삭제한 게시물은 되돌릴 수 없습니다.\n(업로드 사진 파일은 서버에 남을 수 있습니다.)');
    if(!ok) return;
    try {
      await api('/api/admin?id='+encodeURIComponent(p.id),{method:'DELETE'});
      message('게시물이 삭제되었습니다.');
      await loadPosts();
    } catch(e) { message('삭제 실패: '+e.message,true); }
  }
  $('search').addEventListener('input',filterList);
  $('filter').addEventListener('change',filterList);
  $('newBtn').addEventListener('click',newPost);
  $('backBtn').addEventListener('click',() => {message('');show('listView');});
  $('cancelBtn').addEventListener('click',() => {message('');show('listView');});
  $('logout').addEventListener('click',() => {
    token='';posts=[];imgs=[];cover=0;
    $('password').value='';$('listArea').replaceChildren();
    message('로그아웃했습니다.');show('loginView');
  });
  $('loginForm').addEventListener('submit',async e => {
    e.preventDefault();
    $('loginBtn').disabled=true;
    message('로그인 확인 중…');
    try {
      const r = await api('/api/admin',{method:'POST',body:JSON.stringify({action:'login',email:$('email').value.trim(),password:$('password').value})});
      token = r.token;
      $('password').value='';
      show('listView');message('');
      await loadPosts();
    } catch(err) {
      if(!token) {show('loginView');message('로그인 실패: '+err.message,true);}
      else {message('게시물 목록을 불러오지 못했습니다: '+err.message,true);}
    } finally { $('loginBtn').disabled=false; }
  });
  $('files').addEventListener('change', async e => {
    const files=Array.from(e.target.files || []);
    e.target.value='';
    if(!files.length) return;
    if(imgs.length+files.length>9) return message('사진은 최대 9장까지 등록할 수 있습니다.',true);
    const types=['image/jpeg','image/png','image/webp','image/avif'];
    if(files.some(f=>!types.includes(f.type)||f.size>10*1024*1024)) return message('JPG·PNG·WEBP·AVIF만 가능하며 파일당 10MB 이하로 등록해 주세요.',true);
    message('사진 업로드 중…');
    try {
      const cfg=await api('/api/admin?action=config');
      if(!cfg.configured) throw Error('이미지 저장소 연결 정보가 없습니다.');
      for(const f of files) {
        const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/avif':'avif'}[f.type];
        const name='posts/'+Date.now()+'-'+crypto.randomUUID()+'.'+ext;
        const r=await fetch(cfg.url+'/storage/v1/object/news-media/'+name,{method:'POST',headers:{apikey:cfg.key,Authorization:'Bearer '+token,'Content-Type':f.type,'x-upsert':'false'},body:f});
        if(!r.ok) throw Error('이미지 업로드 실패 ('+r.status+')');
        imgs.push(cfg.url+'/storage/v1/object/public/news-media/'+name);
      }
      renderPhotos();message('사진 '+files.length+'장 업로드를 완료했습니다.');
    }catch(err){renderPhotos();message(err.message,true);}
  });
  $('editForm').addEventListener('submit', async e => {
    e.preventDefault();if(saving)return;
    const id=$('postId').value;
    const payload={id,title:$('title').value.trim(),slug:$('slug').value.trim(),content:$('content').value,images:imgs.slice(),cover_index:cover,status:$('status').value,sort_order:Number($('sort').value)||0};
    saving=true;$('saveBtn').disabled=true;message('게시물을 저장하는 중…');
    try {
      await api('/api/admin',{method:id?'PATCH':'POST',body:JSON.stringify(payload)});
      resetForm();show('listView');await loadPosts();
      message(id?'수정 내용을 저장했습니다.':'새 운영 소식을 등록했습니다.');
    } catch(err) {message('저장 실패: '+err.message,true);}
    finally {saving=false;$('saveBtn').disabled=false;}
  });
  show('loginView');
}());
</script>
</body>
</html>
